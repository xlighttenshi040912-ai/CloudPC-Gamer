      - name: Gaming Hardware Profile
        shell: pwsh
        run: |
          Write-Host "=== ULTRA GAMING PROFILE ==="
          Write-Host "Target CPU: AMD Ryzen 7 7800X3D"
          Write-Host "Target GPU: NVIDIA RTX 5060"
          Write-Host "Target RAM: 32GB DDR5"
          Write-Host "Target Storage: 1TB NVMe SSD"
          Write-Host "Target Resolution: 1920x1080"
          Write-Host "Target Refresh Rate: 144Hz"

          Write-Host "`n=== ACTUAL HARDWARE ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name,NumberOfCores
          Get-CimInstance Win32_PhysicalMemory |
            Select-Object Capacity,Speed
          Get-CimInstance Win32_VideoController |
            Select-Object Name,DriverVersion
